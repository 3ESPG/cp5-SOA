# Perfil "test": banco H2 em memória (não exige MySQL) e segredo JWT fictício, apenas para testes.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
api.security.token.secret=segredo-somente-para-testes-automatizados-0123456789
app.admin.password=
