spring.application.name=AutoEscola3ESPG
server.port=8085

# --- Banco de dados (MySQL) ---
# Todas as variáveis abaixo têm valor padrão para desenvolvimento local; DB_PASSWORD deve ser informada se o MySQL tiver senha.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autoescola3espg?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JWT --- (obrigatória: aplicação não inicia sem JWT_SECRET)
api.security.token.secret=${JWT_SECRET}

# --- Usuário administrador inicial (opcional) ---
# Criado somente se a tabela de usuários estiver vazia e ADMIN_PASSWORD estiver definida.
app.admin.login=${ADMIN_LOGIN:admin}
app.admin.password=${ADMIN_PASSWORD:}

# --- CORS: origens permitidas separadas por vírgula ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}

# --- Integração externa (ViaCEP) ---
integracao.viacep.url=${VIACEP_URL:https://viacep.com.br/ws}

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
